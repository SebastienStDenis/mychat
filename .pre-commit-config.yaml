repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: api-lint
        name: Lint API (Python)
        language: system
        pass_filenames: false
        entry: bash -lc 'make -C services/api lint'

      - id: web-lint
        name: Lint Web (Next.js)
        language: system
        pass_filenames: false
        entry: bash -lc 'make -C services/web lint'
