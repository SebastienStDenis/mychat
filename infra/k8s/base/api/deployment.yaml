apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: mychat
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: mychat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: mychat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: mychat
    spec:
      containers:
        - name: api
          image: ghcr.io/sebastienstdenis/mychat/api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: api-configmap
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: OPENAI_API_KEY
