apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: mychat
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: mychat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: mychat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: mychat
    spec:
      containers:
        - name: web
          image: ghcr.io/sebastienstdenis/mychat/web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
