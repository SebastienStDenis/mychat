name: mychat

services:
  nginx:
    image: nginx:alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: always


  # standard for python is to mount only the source code rather than the whole project
  api:
    build:
      context: ${SERVICES_ROOT}/api
      target: dev-runner
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    volumes:
      - ${SERVICES_ROOT}/api/src:/app/src

  api-test:
    build:
      context: ${SERVICES_ROOT}/api
      target: test-runner
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    volumes:
      - ${SERVICES_ROOT}/api/src:/app/src
      - ${SERVICES_ROOT}/api/tests:/app/tests
      - api-volume:/app/data
    depends_on:
      - api


  # standard for next.js is to mount the whole project and ignore host's node_modules by mounting an anonymous volume
  web:
    build:
      context: ${SERVICES_ROOT}/web
      target: dev
    restart: always
    volumes:
      - ${SERVICES_ROOT}/web:/app            # mount project source
      - node_modules_cache:/app/node_modules # volume for container-only deps; kept separate from host’s. Placed AFTER source mount so it doesn’t get overwritten. Npm ci is run in Dockerfile to populate it.
      - npm_cache:/home/node/.npm            # volume for npm’s cache directory for faster installs

volumes:
  node_modules_cache:
  npm_cache:
  api-volume:
