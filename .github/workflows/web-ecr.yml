name: Build & Push Web Docker Image to ECR

on:
  push:
    branches: [ main ]
    paths:
      - "services/web/**"
      - ".github/workflows/web-ecr.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/web/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-2"
  ECR_REPOSITORY: "mychat-web"
  OPENAI_API_KEY: "placeholder"
  OPENAI_MODEL: "gpt-5-nano"
  SERVICES_ROOT: "../../services"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          make install

      - name: Type
        run: |
          make type

      - name: Lint
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      - name: Unit Tests
        run: |
          make test

      - name: Integration Tests
        run: |
          make integration-test

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: imagename
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagename.outputs.value }}
          tags: |
            type=sha
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: services/web
          file: services/web/Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} # these are the LABEL directives in the Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
